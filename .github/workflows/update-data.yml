name: Aggiorna dati EA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-data.yml'
      - 'scripts/**'
      - 'config/club.json'
  schedule:
    # Sera ogni 20 minuti: 17:00-01:59 UTC = 19-03 in estate (CEST), 18-02 in inverno (CET).
    - cron: '0,20,40 17-23,0,1 * * *'
    # Nelle altre ore (02-16 UTC) una volta all'ora, al minuto 17.
    - cron: '17 2-16 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/update-data.js
        env:
          # Opzionali: se i secret non esistono restano vuoti e le notifiche sono disattivate.
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      - name: Conserva una copia anche se il push fallisce
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ea-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          retention-days: 30
      - name: Commit se cambiato
        if: ${{ always() }}
        run: |
          git config user.name "billocchi-bot"
          git config user.email "billocchi-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore: aggiorna dati EA"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            echo "Push fallito: snapshot conservato negli artifact del workflow."
            exit 1
          fi
