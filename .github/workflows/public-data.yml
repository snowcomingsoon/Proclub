name: Verifica dati sul sito pubblico
on:
  workflow_run:
    workflows: ['Aggiorna dati EA']
    types: [completed]
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-data.yml'
      - 'scripts/check-public-data.js'
      - 'api/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: public-data-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confronta archivio e dati ricevuti dai visitatori
        run: node scripts/check-public-data.js
      - name: Riavvia raccolta ferma senza duplicare un ciclo attivo
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update-data.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "requested" or .status == "waiting")] | length')
          if [ "$active" -eq 0 ]; then
            gh workflow run update-data.yml --ref main -R "$GITHUB_REPOSITORY"
          else
            echo "Raccolta già attiva o in coda; non la duplico."
          fi
      - name: Conserva la diagnosi
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: public-delivery-${{ github.run_id }}
          path: public-delivery-report.json
          retention-days: 7
