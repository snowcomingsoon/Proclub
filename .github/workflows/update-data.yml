name: Aggiorna dati EA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-data.yml'
      - 'scripts/**'
      - 'config/club.json'
  schedule:
    # Ogni ora al minuto 17, più (nelle ore serali 17:00-01:59 UTC) un secondo avvio al minuto 47 come rete di sicurezza.
    # Durante la serata ogni esecuzione resta attiva ~50 minuti e interroga EA ogni 3 minuti (scripts/collect-loop.sh),
    # poi avvia la successiva: la raccolta non dipende dalla puntualità del cron di GitHub.
    - cron: '17 * * * *'
    - cron: '47 17-23,0,1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Raccolta (un giro, o ripetuta durante la serata)
        id: collect
        run: bash scripts/collect-loop.sh
        env:
          LOOP_SECONDS: ${{ github.event_name == 'push' && '60' || '3000' }}
          # Opzionali: se i secret non esistono restano vuoti e le notifiche sono disattivate.
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      - name: Conserva una copia anche se il push fallisce
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ea-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          retention-days: 30
      - name: Pubblica i dati nel branch data
        if: ${{ always() }}
        run: bash scripts/publish-data.sh publish

      - name: Avvia il giro successivo (tutto il giorno)
        if: ${{ !cancelled() && steps.collect.outputs.chain == '1' }}
        run: gh workflow run update-data.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
