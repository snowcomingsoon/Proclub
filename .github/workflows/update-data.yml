name: Aggiorna dati EA
on:
  push:
    paths:
      - '.github/workflows/update-data.yml'
      - 'scripts/update-data.js'
  schedule:
    - cron: '17 * * * *'
    - cron: '*/20 17-23,0-1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-data.js
      - name: Commit se cambiato
        if: ${{ always() }}
        run: |
          git config user.name "billocchi-bot"
          git config user.email "billocchi-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "chore: aggiorna dati EA" && git push)
